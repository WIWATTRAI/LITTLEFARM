<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Ellipse Bounce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
/* Layout: one full-height arcade screen — question on top, a glass egg rendered with WebGL in the middle, a control grid at the bottom. Single dark look by choice. */
:root {
  --bg: #0b0c10;
  --panel: #15171d;
  --line: #262a33;
  --fg: #e9ecf2;
  --muted: #8a92a3;
  --rim: #5fe3e8;      /* ellipsoid shell */
  --count: #2fd8b0;    /* stat labels */
  --gold: #f5c25b;     /* foci and numbers */
  --font-display: "Fredoka", "Baloo 2", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body {
  height: 100%;
  margin: 0;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  overflow: hidden;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-inline: 16px;
  padding-block: 10px;
  box-sizing: border-box;
  gap: 8px;
  max-width: 720px;
  margin: 0 auto;
  grid-template-areas: "head" "stage" "ctrl";
}
header { grid-area: head; text-align: center; display: grid; gap: 2px; }
.stage { grid-area: stage; position: relative; flex: 1; min-height: 0; }
.controls { grid-area: ctrl; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.15rem, 4.6vw, 1.8rem);
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.stats {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1rem, 4vw, 1.4rem);
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}
.stats .k { color: var(--count); }
.stats .v { color: var(--gold); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas:active { cursor: grabbing; }
.hint {
  position: absolute; left: 0; right: 0; bottom: 0;
  text-align: center; font-size: 0.78rem; color: var(--muted);
  pointer-events: none;
}
.controls {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  width: 100%; max-width: 520px; margin: 0 auto;
}
.controls .seg { grid-column: span 2; }
.controls .slider { grid-column: span 2; }
button, .seg {
  font: 600 0.88rem var(--font-body);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  min-height: 44px;
  padding: 6px 6px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--rim); color: var(--rim); }
.seg { display: flex; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; min-height: 36px; padding: 4px 6px; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--line); }
label.slider {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.8rem; color: var(--muted); white-space: nowrap;
}
input[type="range"] { accent-color: var(--rim); flex: 1; min-width: 0; height: 28px; }
/* Phone held sideways: stage on the left, title and controls in a side column. */
@media (orientation: landscape) and (max-height: 520px) {
  .app {
    display: grid; max-width: none;
    grid-template-columns: 1fr minmax(280px, 340px);
    grid-template-rows: auto 1fr;
    grid-template-areas: "stage head" "stage ctrl";
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-size: 1.05rem; }
  .stats { font-size: 0.95rem; }
  .controls { align-content: start; overflow-y: auto; }
  .hint { display: none; }
}
@media (max-width: 360px) {
  button, .seg { font-size: 0.76rem; }
  label.slider { font-size: 0.72rem; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Will they all hit the same point?</h1>
    <div class="stats">
      <span><span class="k">balls:</span> <span class="v" id="nBalls">0</span></span>
      <span><span class="k">hits:</span> <span class="v" id="nHits">0</span></span>
      <span><span class="k">popped:</span> <span class="v" id="nPopped">0</span></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="ไข่แก้วทรงรีสามมิติที่มีลูกบอลเด้งอยู่ข้างใน ลากเพื่อหมุนมุมมอง"></canvas>
    <div class="hint" id="hint">ลากเพื่อหมุน · บีบหรือเลื่อนล้อเมาส์เพื่อซูม · แตะเพื่อยิงลูก</div>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="จุดปล่อยลูกบอล">
      <button id="modeFocus" aria-pressed="true">จากโฟกัส</button>
      <button id="modeRandom" aria-pressed="false">จุดสุ่ม</button>
    </div>
    <button id="add1" aria-label="เพิ่ม 1 ลูก">+1</button>
    <button id="add10" aria-label="เพิ่ม 10 ลูก">+10</button>
    <button id="auto" aria-pressed="true">อัตโนมัติ</button>
    <button id="trails" aria-pressed="true">เส้นทาง</button>
    <button id="sound" aria-pressed="false">เสียง</button>
    <button id="reset">เริ่มใหม่</button>
    <button id="spin" aria-pressed="true">หมุนเอง</button>
    <button id="view">มุมมอง</button>
    <button id="collide" aria-pressed="true">ชนกันได้</button>
    <button id="grow" aria-pressed="true">โตตามอายุ</button>
    <label class="slider" for="speed">ความเร็ว <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1"></label>
    <label class="slider" for="growRate">โตเร็ว <input id="growRate" type="range" min="0.001" max="0.02" step="0.001" value="0.012"></label>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// World: prolate spheroid x²/A² + y²/B² + z²/A² = 1, long axis vertical (y up).
// Any ray from one focus reflects off the shell straight through the other focus.
const A = 1, B = 1.55;
const C = Math.sqrt(B * B - A * A);
const F_START = { x: 0, y: -C, z: 0 };  // lower focus: launch point
const F_TARGET = { x: 0, y: C, z: 0 };  // upper focus
const MAX_BALLS = 300;
const TRAIL_POINTS = 6;
const FOCUS_R = 0.05;
const R0 = 0.022, RMAX = 0.24;   // newborn and largest ball radius
const GHOST_TIME = 0.4;          // a new ball ignores collisions until clear of others, at most this long
const FLOOR_Y = -B - 0.2;

const $ = id => document.getElementById(id);
const cv = $('cv');
const stage = $('stage');

let balls = [], hits = 0, popped = 0;
let mode = 'focus', auto = true, showTrails = true, collide = true, grow = true;
let speedMul = 1, growRate = 0.012, spawnClock = 0;
let flashTop = 0, flashBottom = 0;

// ---------- sound ----------
let audio = null, soundOn = false, lastBeep = 0, lastPop = 0, noteIdx = 0;
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
function tone(freq, dur, type, vol) {
  const now = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g).connect(audio.destination);
  o.start(now); o.stop(now + dur + 0.05);
}
function beep() {
  if (!soundOn || !audio || audio.currentTime - lastBeep < 0.045) return;
  lastBeep = audio.currentTime;
  tone(330 * Math.pow(2, SCALE[noteIdx++ % SCALE.length] / 12), 0.35, 'triangle', 0.07);
}
function popSound(size) {
  if (!soundOn || !audio || audio.currentTime - lastPop < 0.04) return;
  lastPop = audio.currentTime;
  tone(700 - size * 1800, 0.12, 'sine', 0.06);
}
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === 'suspended') audio.resume();
}

// ---------- physics ----------
const HUES = 24;
const radius = b => grow ? Math.min(RMAX, R0 + b.age * growRate) : R0;
function randomDir() {
  const u = Math.random() * 2 - 1, phi = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  return { x: s * Math.cos(phi), y: u, z: s * Math.sin(phi) };
}
const q3 = (p, a, b) => (p.x * p.x + p.z * p.z) / (a * a) + p.y * p.y / (b * b);
function randomInside() {
  for (;;) {
    const p = { x: (Math.random() * 2 - 1) * A, y: (Math.random() * 2 - 1) * B, z: (Math.random() * 2 - 1) * A };
    if (q3(p, A * 0.85, B * 0.85) < 1) return p;
  }
}
function addBall(dir, from) {
  if (balls.length >= MAX_BALLS) return;
  const p = from || (mode === 'focus' ? { ...F_START } : randomInside());
  const d = dir || randomDir();
  balls.push({
    x: p.x, y: p.y, z: p.z, vx: d.x, vy: d.y, vz: d.z,
    age: 0, color: Math.floor(Math.random() * HUES),
    pts: [{ x: p.x, y: p.y, z: p.z }],
    nearTop: false, ghost: true, ghostT: GHOST_TIME, touching: false, dead: false,
  });
  $('nBalls').textContent = balls.length;
}
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
  const L = dx * dx + dy * dy + dz * dz;
  let t = L ? ((p.x - a.x) * dx + (p.y - a.y) * dy + (p.z - a.z) * dz) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(a.x + t * dx - p.x, a.y + t * dy - p.y, a.z + t * dz - p.z);
}
function checkFocus(b, a, e) {
  const inTop = segDist(F_TARGET, a, e) < FOCUS_R;
  if (inTop && !b.nearTop) { hits++; flashTop = 1; beep(); }
  b.nearTop = inTop;
  if (b.age > 0.2 && segDist(F_START, a, e) < FOCUS_R) flashBottom = Math.max(flashBottom, 0.6);
}
// The ball's centre bounces off the shell shrunk by its radius, so a big ball touches the glass with its surface.
function stepBall(b, dist) {
  const r = radius(b);
  const a = Math.max(0.1, A - r), bb = Math.max(0.1, B - r);
  const q0 = q3(b, a, bb);
  if (q0 >= 0.999) { const k = Math.sqrt(0.998 / q0); b.x *= k; b.y *= k; b.z *= k; }
  const ia = 1 / (a * a), ib = 1 / (bb * bb);
  for (let iter = 0; iter < 4 && dist > 1e-9; iter++) {
    const dx = b.vx * dist, dy = b.vy * dist, dz = b.vz * dist;
    const n = { x: b.x + dx, y: b.y + dy, z: b.z + dz };
    if (q3(n, a, bb) < 1) { checkFocus(b, b, n); b.x = n.x; b.y = n.y; b.z = n.z; return; }
    const qa = (dx * dx + dz * dz) * ia + dy * dy * ib;
    const qb = 2 * ((b.x * dx + b.z * dz) * ia + b.y * dy * ib);
    const qc = q3(b, a, bb) - 1;
    const t = (-qb + Math.sqrt(Math.max(0, qb * qb - 4 * qa * qc))) / (2 * qa);
    const h = { x: b.x + dx * t, y: b.y + dy * t, z: b.z + dz * t };
    checkFocus(b, b, h);
    let gx = h.x * ia, gy = h.y * ib, gz = h.z * ia;
    const gl = Math.hypot(gx, gy, gz); gx /= gl; gy /= gl; gz /= gl;
    const dot = b.vx * gx + b.vy * gy + b.vz * gz;
    b.vx -= 2 * dot * gx; b.vy -= 2 * dot * gy; b.vz -= 2 * dot * gz;
    b.x = h.x * 0.999999; b.y = h.y * 0.999999; b.z = h.z * 0.999999;
    b.pts.push({ x: b.x, y: b.y, z: b.z });
    if (b.pts.length > TRAIL_POINTS) b.pts.shift();
    dist *= (1 - t);
  }
}
// When two balls touch, the older one pops and the younger keeps flying.
function collideAll() {
  for (const b of balls) b.touching = false;
  const n = balls.length;
  let any = false;
  for (let i = 0; i < n; i++) {
    const p = balls[i]; if (p.dead) continue;
    const rp = radius(p);
    for (let j = i + 1; j < n; j++) {
      const o = balls[j]; if (o.dead) continue;
      const rs = rp + radius(o);
      const dx = o.x - p.x; if (dx > rs || dx < -rs) continue;
      const dy = o.y - p.y; if (dy > rs || dy < -rs) continue;
      const dz = o.z - p.z;
      if (dx * dx + dy * dy + dz * dz >= rs * rs) continue;
      p.touching = o.touching = true;
      if (p.ghost || o.ghost) continue;
      const older = p.age >= o.age ? p : o;
      older.dead = true; any = true;
      popped++;
      spawnPop(older);
      popSound(radius(older));
      if (older === p) break;
    }
  }
  if (any) {
    balls = balls.filter(b => !b.dead);
    $('nPopped').textContent = popped;
    $('nBalls').textContent = balls.length;
  }
  for (const b of balls) if (b.ghost && (!b.touching || b.ghostT <= 0)) b.ghost = false;
}

// ---------- renderer and scene ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
} catch (e) {
  $('hint').hidden = false;
  $('hint').textContent = 'เครื่องนี้เปิด WebGL ไม่ได้ จึงแสดงภาพสามมิติไม่ได้';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.Fog(0x0b0c10, 6, 13);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
const controls = new OrbitControls(camera, cv);
controls.target.set(0, -0.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minPolarAngle = 0.05;

// lights: a soft key light that casts shadows, a cool rim from behind
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x1a1410, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1; key.shadow.camera.far = 16;
key.shadow.radius = 4;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fe9ff, 0.8);
rim.position.set(-4, 2, -5);
scene.add(rim);

// floor: dark satin surface that catches shadows and the glow
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0x101217, roughness: 0.7, metalness: 0.05, envMapIntensity: 0.25 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR_Y;
floor.receiveShadow = true;
scene.add(floor);

// pedestal ring the glass egg sits in
const metal = new THREE.MeshStandardMaterial({ color: 0x8a8f99, roughness: 0.28, metalness: 1 });
const base = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.72, 0.12, 64), metal);
base.position.y = FLOOR_Y + 0.06;
base.castShadow = true; base.receiveShadow = true;
scene.add(base);
const collar = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.035, 16, 96), metal);
collar.rotation.x = Math.PI / 2;
collar.position.y = -B * Math.sqrt(1 - 0.25) + 0.0;
collar.castShadow = true;
scene.add(collar);
const posts = new THREE.Group();
for (let i = 0; i < 3; i++) {
  const a = i / 3 * Math.PI * 2;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, collar.position.y - (FLOOR_Y + 0.12), 12), metal);
  post.position.set(Math.cos(a) * 0.5, (collar.position.y + FLOOR_Y + 0.12) / 2, Math.sin(a) * 0.5);
  post.castShadow = true;
  posts.add(post);
}
scene.add(posts);

// glass shell: an outer refracting surface and a faint inner back face
const shellGeo = new THREE.SphereGeometry(1, 128, 96);
const shell = new THREE.Mesh(shellGeo, new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 0.06, ior: 1.47,
  clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.2, attenuationColor: new THREE.Color(0xd9fbff), attenuationDistance: 3,
}));
shell.scale.set(A, B, A);
scene.add(shell);
const inner = new THREE.Mesh(shellGeo, new THREE.MeshPhysicalMaterial({
  color: 0xc8f6ff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.08, side: THREE.BackSide, depthWrite: false, envMapIntensity: 1.5,
}));
inner.scale.set(A * 0.995, B * 0.995, A * 0.995);
scene.add(inner);

// foci: tiny glowing beads with a light inside, so passing balls catch a warm highlight
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.2, 'rgba(255,214,140,0.85)');
  grd.addColorStop(0.5, 'rgba(255,150,60,0.25)'); grd.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTexture();
function makeFocus(p, color) {
  const grp = new THREE.Group();
  grp.position.set(p.x, p.y, p.z);
  const bead = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 12), new THREE.MeshBasicMaterial({ color }));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.scale.setScalar(0.25);
  const light = new THREE.PointLight(color, 0.4, 2.2, 2);
  grp.add(bead, halo, light);
  scene.add(grp);
  return { halo, light };
}
const focusTop = makeFocus(F_TARGET, 0xffa24a);
const focusBottom = makeFocus(F_START, 0xffd27a);

// balls: one instanced mesh of glossy coloured spheres
const ballMat = new THREE.MeshPhysicalMaterial({ roughness: 0.18, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.1 });
const ballMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 32, 20), ballMat, MAX_BALLS);
ballMesh.castShadow = true; ballMesh.receiveShadow = true;
ballMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
ballMesh.frustumCulled = false;
const PALETTE = Array.from({ length: HUES }, (_, i) => new THREE.Color().setHSL(i / HUES, 0.85, 0.5));
for (let i = 0; i < MAX_BALLS; i++) ballMesh.setColorAt(i, PALETTE[0]);
ballMesh.count = 0;
scene.add(ballMesh);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3();

// trails: faint coloured lines through the last bounce points
const TRAIL_SEGS = MAX_BALLS * TRAIL_POINTS;
const trailPos = new Float32Array(TRAIL_SEGS * 6), trailCol = new Float32Array(TRAIL_SEGS * 6);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3).setUsage(THREE.DynamicDrawUsage));
const trails = new THREE.LineSegments(trailGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending }));
trails.frustumCulled = false;
scene.add(trails);

// pops: a bright flash that swells and fades where an older ball vanished
const pops = [];
const popGeo = new THREE.SphereGeometry(1, 20, 14);
function spawnPop(b) {
  let p = pops.find(x => !x.mesh.visible);
  if (!p) {
    if (pops.length >= 40) return;
    p = { mesh: new THREE.Mesh(popGeo, new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })), t: 0, r: 0 };
    scene.add(p.mesh); pops.push(p);
  }
  p.mesh.material.color.copy(PALETTE[b.color]);
  p.mesh.position.set(b.x, b.y, b.z);
  p.r = radius(b); p.t = 0; p.mesh.visible = true;
}

// ---------- camera framing and views ----------
const VIEWS = [
  { polar: 1.22, az: 0.6 },          // tilted
  { polar: Math.PI / 2 - 0.02, az: 0 }, // side, like the original video
  { polar: 0.12, az: 0 },            // looking down the long axis
];
let viewIdx = 0;
function fitDistance() {
  const fov = camera.fov * Math.PI / 180;
  const needH = 2 * B * 1.32, needW = 2 * A * 1.5;
  const dH = needH / 2 / Math.tan(fov / 2);
  const dW = needW / 2 / Math.tan(fov / 2) / camera.aspect;
  return Math.max(dH, dW) + A;
}
function setView(i) {
  const v = VIEWS[i], d = fitDistance();
  camera.position.set(
    controls.target.x + d * Math.sin(v.polar) * Math.sin(v.az),
    controls.target.y + d * Math.cos(v.polar),
    controls.target.z + d * Math.sin(v.polar) * Math.cos(v.az));
  controls.update();
}
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
  controls.minDistance = fitDistance() * 0.45;
  controls.maxDistance = fitDistance() * 2.2;
}

// ---------- per-frame scene update ----------
function syncScene() {
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i], r = radius(b);
    v3.set(b.x, b.y, b.z); s3.setScalar(r);
    m4.compose(v3, q, s3);
    ballMesh.setMatrixAt(i, m4);
    ballMesh.setColorAt(i, PALETTE[b.color]);
  }
  ballMesh.count = balls.length;
  ballMesh.instanceMatrix.needsUpdate = true;
  if (ballMesh.instanceColor) ballMesh.instanceColor.needsUpdate = true;

  trails.visible = showTrails;
  if (showTrails) {
    let k = 0;
    for (const b of balls) {
      const c = PALETTE[b.color];
      const pts = b.pts;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], e = i + 1 < pts.length ? pts[i + 1] : b;
        trailPos[k] = a.x; trailPos[k + 1] = a.y; trailPos[k + 2] = a.z;
        trailPos[k + 3] = e.x; trailPos[k + 4] = e.y; trailPos[k + 5] = e.z;
        for (let j = 0; j < 6; j += 3) { trailCol[k + j] = c.r; trailCol[k + j + 1] = c.g; trailCol[k + j + 2] = c.b; }
        k += 6;
      }
    }
    trailGeo.setDrawRange(0, k / 3);
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.attributes.color.needsUpdate = true;
    trails.material.opacity = balls.length > 120 ? 0.25 : 0.4;
  }

  focusTop.light.intensity = 0.4 + flashTop * 3;
  focusTop.halo.scale.setScalar(0.22 + flashTop * 0.35);
  focusBottom.light.intensity = 0.4 + flashBottom * 2;
  focusBottom.halo.scale.setScalar(0.22 + flashBottom * 0.3);
}
function updatePops(dt) {
  for (const p of pops) {
    if (!p.mesh.visible) continue;
    p.t += dt;
    const k = p.t / 0.45;
    if (k >= 1) { p.mesh.visible = false; continue; }
    p.mesh.scale.setScalar(p.r * (1 + k * 1.8));
    p.mesh.material.opacity = 0.9 * (1 - k);
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (auto && balls.length < MAX_BALLS) {
    spawnClock += dt;
    if (spawnClock > 0.9) { spawnClock = 0; addBall(); }
  }
  for (const b of balls) { b.age += dt; if (b.ghost) b.ghostT -= dt; }
  const dist = 0.9 * speedMul * dt;
  if (collide) {
    const n = Math.max(1, Math.min(6, Math.ceil(dist / R0)));
    for (let i = 0; i < n; i++) { for (const b of balls) stepBall(b, dist / n); collideAll(); }
  } else {
    for (const b of balls) stepBall(b, dist);
  }
  updatePops(dt);
  flashTop *= 0.9; flashBottom *= 0.9;
  $('nHits').textContent = hits;
  syncScene();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- controls ----------
function setPressed(el, on) { el.setAttribute('aria-pressed', on ? 'true' : 'false'); }
function reset() {
  balls = []; hits = 0; popped = 0; spawnClock = 0;
  $('nBalls').textContent = 0; $('nPopped').textContent = 0;
  for (let i = 0; i < 8; i++) addBall();
}
$('modeFocus').onclick = () => { mode = 'focus'; setPressed($('modeFocus'), true); setPressed($('modeRandom'), false); reset(); };
$('modeRandom').onclick = () => { mode = 'random'; setPressed($('modeFocus'), false); setPressed($('modeRandom'), true); reset(); };
$('add1').onclick = () => addBall();
$('add10').onclick = () => { for (let i = 0; i < 10; i++) addBall(); };
$('auto').onclick = () => { auto = !auto; setPressed($('auto'), auto); };
$('trails').onclick = () => { showTrails = !showTrails; setPressed($('trails'), showTrails); };
$('reset').onclick = reset;
$('spin').onclick = () => { controls.autoRotate = !controls.autoRotate; setPressed($('spin'), controls.autoRotate); };
$('view').onclick = () => {
  viewIdx = (viewIdx + 1) % VIEWS.length;
  setView(viewIdx);
  controls.autoRotate = viewIdx === 0; setPressed($('spin'), controls.autoRotate);
};
$('collide').onclick = () => {
  collide = !collide; setPressed($('collide'), collide);
  for (const b of balls) { b.ghost = true; b.ghostT = GHOST_TIME; }
};
$('grow').onclick = () => { grow = !grow; setPressed($('grow'), grow); };
$('speed').oninput = e => { speedMul = parseFloat(e.target.value); };
$('growRate').oninput = e => { growRate = parseFloat(e.target.value); };
$('sound').onclick = () => {
  soundOn = !soundOn;
  if (soundOn) unlockAudio();
  if (!audio) soundOn = false;
  setPressed($('sound'), soundOn);
};

// Tap (no drag) fires a ball from the launch point toward the tapped spot, on the plane facing the camera.
let tap = null, pointersDown = 0;
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(), hit = new THREE.Vector3();
cv.addEventListener('pointerdown', e => {
  pointersDown++;
  tap = pointersDown === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null;
});
cv.addEventListener('pointermove', e => {
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 6) tap = null;
});
const endPointer = e => {
  pointersDown = Math.max(0, pointersDown - 1);
  if (e.type === 'pointerup' && tap && pointersDown === 0 && performance.now() - tap.t < 400) launchAt(e);
  if (pointersDown === 0) tap = null;
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
function launchAt(e) {
  unlockAudio();
  const r = cv.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const from = mode === 'focus' ? { ...F_START } : randomInside();
  const fv = new THREE.Vector3(from.x, from.y, from.z);
  const facing = camera.getWorldDirection(new THREE.Vector3());
  plane.setFromNormalAndCoplanarPoint(facing, fv);
  let d;
  if (raycaster.ray.intersectPlane(plane, hit) && hit.distanceTo(fv) > 1e-3) d = hit.sub(fv).normalize();
  else d = new THREE.Vector3(0, 1, 0);
  addBall({ x: d.x, y: d.y, z: d.z }, from);
  if (!$('hint').hidden) $('hint').hidden = true;
}

window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize();
setView(0);
reset();
requestAnimationFrame(frame);
window.__ellipse = { get balls() { return balls; }, get popped() { return popped; }, renderer };
</script>
</body>
</html>
